name: Build GBA ROM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          make

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: arceus-final-dawn-rom
          path: "*.gba"
